name: shelfcash-integration-s411
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: shelfcash_integration_s411
      POSTGRES_USER: shelfcash_integration
      POSTGRES_PASSWORD: ${S411_POSTGRES_PASSWORD:?Use the private integration env file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - integration-s411-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfcash_integration -d shelfcash_integration_s411"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  integration-s411-data:
