[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfcash-backend"
version = "1.0.0"
description = "ShelfCash Competition Edition backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.14,<0.116",
  "python-multipart>=0.0.20,<0.1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "argon2-cffi==25.1.0",
  "cryptography>=46,<47",
  "lightgbm==4.6.0",
  "numpy==2.2.6",
  "scipy==1.17.1",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1", "pypdf>=6,<7", "pypdfium2>=5,<6"]

[tool.setuptools.package-data]
app = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/fonts/*.md"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
